        <li class="post-item" data-title="Generators" data-category="programming python " data-content="Python generators are a simple way to create iterators without storing everything in memory at once. They are especially useful when working with large datasets or when you want to lazily produce values one at a time. Why use generators? A normal function returns a single value, but a generator yields one value at a time and pauses between yields. This makes it easy to process streams of data efficiently. def count_up_to(limit): current = 1 while current &amp;lt;= limit: yield current current += 1 for value in count_up_to(5): print(value) This prints: 1 2 3 4 5 When to prefer generators processing large files streaming data from APIs working with infinite or very large sequences reducing memory usage in data pipelines Generators are a powerful tool in Python because they keep code readable while improving efficiency.">

        <li class="post-item" data-title="Virtual Threads in Java" data-category="programming java " data-content="Java virtual threads are part of Project Loom and provide a lightweight alternative to traditional platform threads. They are designed to make concurrent applications easier to write and scale without requiring a large thread pool or complex async code. Why virtual threads matter Traditional Java threads are still backed by OS threads, which means creating thousands or even millions of them can become expensive. Virtual threads solve this by allowing many tasks to run concurrently while using far fewer OS resources. This is especially useful for web servers, APIs, and applications that handle many independent I/O-bound tasks. A simple example import java.util.concurrent.ExecutorService; import java.util.concurrent.Executors; public class VirtualThreadDemo { public static void main(String[] args) throws InterruptedException { try (ExecutorService executor = Executors.newVirtualThreadPerTaskExecutor()) { for (int i = 0; i &amp;lt; 10; i++) { int taskId = i; executor.submit(() -&amp;gt; { System.out.println(&quot;Task &quot; + taskId + &quot; started&quot;); try { Thread.sleep(1000); } catch (InterruptedException e) { Thread.currentThread().interrupt(); } System.out.println(&quot;Task &quot; + taskId + &quot; finished&quot;); }); } } } } This pattern is very readable and makes it easy to think of each task as a separate unit of work. When to use them Virtual threads are ideal when: you have many I/O-bound tasks your application makes lots of network calls or database queries you want simpler concurrency code without callback-heavy async style Trade-offs They are not a replacement for all threading patterns. CPU-bound work still benefits from a more careful design, and thread-local state must be handled with awareness. Still, for many modern Java services, virtual threads are a big step forward in making concurrency easier to manage. Final thoughts Virtual threads make Java better suited for highly concurrent workloads without the usual overhead of massive thread pools. If you are building modern Java applications, they are worth learning seriously.">

<script>
  const searchInput = document.getElementById('post-search');
  const posts = Array.from(document.querySelectorAll('.post-item'));

  function applyFilter(query) {
    const normalized = (query || '').trim().toLowerCase();

    posts.forEach(function (post) {
      const text = (post.dataset.title || '') + ' ' + (post.dataset.category || '') + ' ' + (post.dataset.content || '');
      const isMatch = !normalized || text.toLowerCase().includes(normalized);
      post.style.display = isMatch ? '' : 'none';
    });
  }

  if (searchInput) {
    searchInput.addEventListener('input', function () {
      applyFilter(this.value);
    });
  }

  document.addEventListener('click', function (event) {
    const tag = event.target.closest('.category-tag');
    if (!tag) return;

    event.preventDefault();
    const category = tag.dataset.category || '';
    if (searchInput) {
      searchInput.value = category;
    }
    applyFilter(category);
  });
</script>
